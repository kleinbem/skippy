name: Restore validated candidate source
description: Restore an upgrade candidate using the protected checkout's source admission command.
inputs:
  artifact:
    description: Same-run immutable candidate artifact, empty for normal SHA checkout.
    default: ''
  sha:
    description: Expected candidate commit.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.artifact != ''
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/skippy-candidate
    - name: Admit exact candidate
      if: inputs.artifact != ''
      shell: bash
      env:
        CANDIDATE_SHA: ${{ inputs.sha }}
        CANDIDATE_DIRECTORY: ${{ runner.temp }}/skippy-candidate
      run: just automation-run upgrade restore "$CANDIDATE_DIRECTORY/candidate.bundle" "$CANDIDATE_SHA"
