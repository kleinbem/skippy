[workspace]
members = ["crates/*", "tools/process-supervision"]
default-members = ["crates/skippy-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.80.0"
repository = "https://github.com/Mesh-LLM/skippy"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio-tungstenite = "0.29"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
