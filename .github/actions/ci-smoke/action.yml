name: Smoke qualification
description: Run the shared smoke contract for one admitted runtime.
inputs:
  runtime_id:
    description: Runtime from ci/targets.json
    required: true
  download-package:
    description: Restore the archived package for a separate release device smoke.
    default: 'false'
  candidate_artifact:
    description: Protected candidate source artifact
    default: ''
  candidate_sha:
    description: Immutable candidate source revision
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      if: inputs.download-package == 'true' && runner.environment == 'github-hosted'
      with:
        cache: 'false'
    - uses: ./.github/actions/source
      if: inputs.download-package == 'true'
      with:
        artifact: ${{ inputs.candidate_artifact }}
        sha: ${{ inputs.candidate_sha }}
    - uses: ./.github/actions/cache
      if: inputs.download-package == 'true'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.download-package == 'true'
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-product-${{ inputs.runtime_id }}
        path: dist/products/${{ inputs.runtime_id }}
    - name: Restore immutable Qwen3 smoke fixture
      if: ${{ !startsWith(runner.name, 'depot-') && env.SKIPPY_CI_MODEL == '' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: target/ci-models/Qwen3-0.6B-Q8_0.gguf
        key: smoke-model-v1-qwen3-dense-${{ hashFiles('ci/llama-canary/model-fixtures.json', 'scripts/ci-model-fetch.sh', 'scripts/lib/ci_smoke.py') }}
    - name: Admit pinned Qwen3 fixture
      run: just ci-model-fetch
      shell: bash
    - name: Execute packaged Qwen3 on the required backend
      shell: bash
      env:
        RUNTIME_ID: ${{ inputs.runtime_id }}
      run: just ci-smoke "$RUNTIME_ID" "dist/products/$RUNTIME_ID"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: inputs.download-package == 'true'
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-device-evidence-${{ inputs.runtime_id }}
        path: dist/products/${{ inputs.runtime_id }}/evidence
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7
    - name: Upload release device failure evidence
      if: failure() && inputs.download-package == 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-device-${{ inputs.runtime_id }}-diagnostics
        path: dist/products/${{ inputs.runtime_id }}/evidence/**
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
