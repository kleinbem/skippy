name: Prepare compiler cache
description: Prepare pinned sccache and select the compiler cache backend and access mode.
inputs:
  scope:
    description: Platform and backend identity for cache isolation.
    required: true
runs:
  using: composite
  steps:
    - name: Export Actions cache settings
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        USE_DEPOT_CACHE: ${{ startsWith(runner.name, 'depot-') }}
      with:
        script: |
          core.exportVariable('SKIPPY_ACTIONS_CACHE_MODE', process.env.ACTIONS_CACHE_MODE || '');
          if (process.env.USE_DEPOT_CACHE !== 'true') {
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
          }
    - name: Prepare pinned sccache
      shell: bash
      env:
        SCCACHE_SCOPE: ${{ inputs.scope }}
        USE_DEPOT_CACHE: ${{ startsWith(runner.name, 'depot-') }}
      run: |
        set -euo pipefail
        version=0.19.0
        sccache_path="$(command -v sccache || true)"
        if [[ -z "$sccache_path" || "$("$sccache_path" --version 2>/dev/null || true)" != "sccache $version" ]]; then
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              target=x86_64-unknown-linux-musl
              checksum=aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
              ;;
            Linux/ARM64)
              target=aarch64-unknown-linux-musl
              checksum=3e47fc4a71b1ddd1b4294a0de9d34498922fdf41e3cd0bda5df3954e3d6deb9d
              ;;
            macOS/ARM64)
              target=aarch64-apple-darwin
              checksum=a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af
              ;;
            *)
              echo "sccache $version is not provisioned for $RUNNER_OS/$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/sccache-v$version-$target.tar.gz"
          install_dir="$RUNNER_TEMP/skippy-sccache"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/mozilla/sccache/releases/download/v$version/sccache-v$version-$target.tar.gz"
          if [[ "$RUNNER_OS" != macOS ]] && command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          else
            [[ "$(shasum -a 256 "$archive" | awk '{print $1}')" == "$checksum" ]]
          fi
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          sccache_path="$install_dir/sccache"
          chmod +x "$sccache_path"
        fi

        recipe_digest="$({
          git ls-files -z Cargo.lock skippy-api-rs/Cargo.lock rust-toolchain.toml \
            .cargo/config.toml Justfile scripts/build-llama.sh scripts/cargo-linker\* \
            llama_cpp/upstream.txt llama_cpp/whisper-upstream.txt llama_cpp/patches
        } | xargs -0 git hash-object | shasum -a 256 | awk '{print $1}')"
        export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE"
        namespace="skippy-v1-$SCCACHE_SCOPE-$recipe_digest"
        cache_mode=READ_ONLY
        case "${GITHUB_REF:-}:$GITHUB_EVENT_NAME" in
          refs/heads/main:push|refs/heads/main:schedule|refs/heads/main:workflow_dispatch)
            if [[ "${GITHUB_REF_PROTECTED:-false}" == true && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]; then
              case "${SKIPPY_ACTIONS_CACHE_MODE:-write}" in
                write|write-only) cache_mode=READ_WRITE ;;
              esac
            fi
            ;;
        esac
        if [[ "$USE_DEPOT_CACHE" == true ]]; then
          if [[ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]]; then
            echo "::error::Depot did not configure the sccache WebDAV connection for this job."
            exit 1
          fi
          # SCCACHE_GHA_VERSION enables the Actions backend even when its flag is false.
          unset SCCACHE_GHA_VERSION
          export SCCACHE_GHA_ENABLED=false
          export SCCACHE_WEBDAV_KEY_PREFIX="$namespace"
          export SCCACHE_WEBDAV_RW_MODE="$cache_mode"
          backend=WebDAV
        else
          export SCCACHE_GHA_VERSION="$namespace"
          export SCCACHE_GHA_RW_MODE="$cache_mode"
          backend=Actions
        fi
        echo "sccache $backend cache mode: $cache_mode"
        if [[ "${RUNNER_NAME:-}" == jy-*-linux && "$SCCACHE_SCOPE" == package-linux-x86_64-cuda13-* ]]; then
          printf 'sccache directory: %s\n' "${SCCACHE_DIR:-<unset>}"
          [[ "${SCCACHE_DIR:-}" == /home/runner/.cache/sccache/actions-runner ]]
          findmnt --noheadings --output TARGET --mountpoint /home/runner/.cache/sccache
        fi
        "$sccache_path" --stop-server >/dev/null 2>&1 || true
        "$sccache_path" --start-server
        "$sccache_path" --zero-stats
        {
          echo "RUSTC_WRAPPER=$sccache_path"
          echo "SCCACHE=$sccache_path"
          echo "CMAKE_C_COMPILER_LAUNCHER=$sccache_path"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$sccache_path"
          echo "SCCACHE_BASEDIRS=$SCCACHE_BASEDIRS"
          if [[ "$USE_DEPOT_CACHE" == true ]]; then
            echo "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED"
            echo 'SCCACHE_GHA_VERSION='
            echo "SCCACHE_WEBDAV_KEY_PREFIX=$SCCACHE_WEBDAV_KEY_PREFIX"
            echo "SCCACHE_WEBDAV_RW_MODE=$SCCACHE_WEBDAV_RW_MODE"
          else
            echo "SCCACHE_GHA_VERSION=$SCCACHE_GHA_VERSION"
            echo "SCCACHE_GHA_RW_MODE=$SCCACHE_GHA_RW_MODE"
          fi
        } >> "$GITHUB_ENV"
