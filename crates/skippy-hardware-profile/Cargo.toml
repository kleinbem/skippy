[package]
name = "skippy-hardware-profile"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Host hardware profile detection for Skippy native runtime selection"
repository = "https://github.com/Mesh-LLM/skippy"
homepage = "https://github.com/Mesh-LLM/skippy"
readme = "README.md"

[lints]
workspace = true

[dependencies]
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
skippy-native-runtime = { path = "../skippy-native-runtime", version = "0.80.0" }
sysinfo = "0.38"
serde_json.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"
