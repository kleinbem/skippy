name: PR checks
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI, CI PR, Documentation, Documentation PR, CI images, CI images PR, Inference qualification]
    types: [in_progress, completed]
  check_run:
    types: [created, completed]
  status:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  statuses: write
concurrency:
  group: pr-checks-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.event.sha }}
  # Serialize evaluations for one PR commit without replacing a pending run.
  queue: max
jobs:
  aggregate:
    name: Evaluate aggregate PR checks
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'check_run' || github.event_name == 'status' ||
      contains(fromJSON('["pull_request", "pull_request_target"]'), github.event.workflow_run.event)
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      # Only protected code runs with the status-writing token. No candidate code,
      # native tools, model inputs, or lab credentials are needed here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPOT_RUNNERS_ENABLED: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED }}
        with:
          script: |
            await require('./.github/scripts/pr-checks.cjs')({
              github, context, core, depot: process.env.DEPOT_RUNNERS_ENABLED === 'true'
            });
