name: Report sccache statistics
description: Print the compiler cache counters and capture machine-readable evidence.
inputs:
  phase:
    description: Build phase reached when the cumulative counters are collected.
    default: build
  artifact-prefix:
    description: Upload a separate artifact with this prefix if provided.
    default: ''
runs:
  using: composite
  steps:
    - name: Capture compiler cache statistics
      id: capture
      if: ${{ !cancelled() }}
      shell: bash
      continue-on-error: true
      env:
        PHASE: ${{ inputs.phase }}
      run: bash "$GITHUB_ACTION_PATH/report.sh" "$PHASE"
    - name: Upload compiler cache statistics
      if: ${{ !cancelled() && inputs.artifact-prefix != '' && steps.capture.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ inputs.artifact-prefix }}-sccache-${{ github.run_attempt }}
        path: target/ci-evidence/sccache-${{ inputs.phase }}.json
        if-no-files-found: warn
        retention-days: 14
