name: Release
on:
  # Daily patch release of main. A day without new commits publishes nothing.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, including the v prefix. Empty selects the next patch version.
        type: string
        default: ''
      canary:
        description: Verify a candidate without promoting or publishing it.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: skippy-release
  queue: max
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
jobs:
  admission:
    if: github.repository == 'Mesh-LLM/skippy' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.admit.outputs.tag }}
      base: ${{ steps.admit.outputs.base }}
      source: ${{ steps.admit.outputs.source }}
      prerelease: ${{ steps.admit.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          tag="${RELEASE_TAG:-$(just release-candidate next)}"
          if [[ -z "$tag" ]]; then
            echo 'main has no commits since its last release. Nothing to release.'
            exit 0
          fi
          just release-candidate stage "$tag"
  validation:
    needs: admission
    if: needs.admission.outputs.tag != ''
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      artifact_scope: release
      profile: full
      cuda_architecture_mode: release
      source_ref: ${{ needs.admission.outputs.source }}
  documentation_validation:
    needs: admission
    if: needs.admission.outputs.tag != ''
    uses: ./.github/workflows/docs.yml
    with:
      artifact_scope: release
      source_ref: ${{ needs.admission.outputs.source }}
  inference:
    needs: admission
    if: needs.admission.outputs.tag != ''
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/inference.yml
    with:
      release_candidate: ${{ needs.admission.outputs.source }}
    secrets:
      JIANYANG_INFERENCE_SSH_KEY: ${{ secrets.JIANYANG_INFERENCE_SSH_KEY }}
  verify:
    needs: [admission, validation, inference, documentation_validation]
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-product-*
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-device-evidence-*
          path: release-artifacts
      - name: Verify the complete candidate release matrix
        env:
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: just release-prepare-candidate "$RELEASE_TAG" release-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !inputs.canary }}
        with:
          name: validated-release-${{ needs.admission.outputs.source }}
          path: dist/release/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  publish:
    needs: [admission, verify]
    if: ${{ !inputs.canary }}
    environment: release
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.admission.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-product-*
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-device-evidence-*
          path: release-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-${{ needs.admission.outputs.source }}
          path: release-receipt
      - name: Verify the artifacts match the candidate receipt
        env:
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: |
          just release-prepare-candidate "$RELEASE_TAG" release-artifacts
          cmp release-receipt/release.json dist/release/release.json
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: release-app
        # Without the release App the built-in token publishes the tag only.
        if: vars.SKIPPY_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.SKIPPY_RELEASE_APP_ID }}
          private-key: ${{ secrets.SKIPPY_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: skippy
          permission-contents: write
      - name: Promote the exact tested commit and tag
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
          SKIPPY_RELEASE_TAG_ONLY: ${{ vars.SKIPPY_RELEASE_APP_ID == '' && '1' || '' }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
          BASE_SHA: ${{ needs.admission.outputs.base }}
          SOURCE_SHA: ${{ needs.admission.outputs.source }}
        run: just release-candidate promote "$RELEASE_TAG" "$BASE_SHA" "$SOURCE_SHA"
      - name: Fetch the promoted main and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          just check-release "$RELEASE_TAG"
      - name: Read existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 1000 --json tagName,isDraft > release-index.json
      - id: existing
        env:
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: just release-select "$RELEASE_TAG" release-index.json
      - name: Create source-bound private draft
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
          SOURCE_SHA: ${{ needs.admission.outputs.source }}
          PRERELEASE: ${{ needs.admission.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$PRERELEASE" --title "Skippy $RELEASE_TAG" --notes "Skippy source: $SOURCE_SHA"
      - name: Read immutable draft asset identities
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: |
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > remote-release.json
      - name: Admit existing assets and select missing uploads
        if: steps.existing.outputs.published != 'true'
        run: just release-upload-plan dist/release remote-release.json
      - name: Upload only missing verified assets
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: |
          while IFS= read -r asset; do
            gh release upload "$RELEASE_TAG" "$asset"
          done < release-upload.txt
      - name: Download published bytes for independent checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir downloaded-release
      - run: |
          just release-verify downloaded-release
          cmp dist/release/release.json downloaded-release/release.json
      - name: Publish complete release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.admission.outputs.tag }}
          PRERELEASE: ${{ needs.admission.outputs.prerelease }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
  documentation:
    needs: [admission, publish]
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.0'
          cache: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED != 'true' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: docs-site/package-lock.json
      - name: Install pinned documentation tooling
        run: just docs-install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-docs-site
          path: docs-site/out
      - name: Deploy validated documentation to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SKIPPY_DOCS_CLOUDFLARE_API_TOKEN }}
        run: just docs-publish
  cleanup:
    needs: [admission, verify, publish, documentation]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (inputs.canary || needs.documentation.result == 'success') }}
    permissions:
      contents: write
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Remove the completed run's candidate ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.admission.outputs.source }}
        run: just release-candidate cleanup "$SOURCE_SHA"
