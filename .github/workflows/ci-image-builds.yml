name: Build CI images
on:
  workflow_call:
    inputs:
      image-set:
        description: Select CPU, GPU, or both sets of compiler images.
        type: string
        default: all
      build-images:
        description: Build and smoke images; false retains only matrix validation for direct publication.
        type: boolean
        default: true
    outputs:
      gpu-matrix:
        value: ${{ jobs.matrix.outputs.gpu }}
permissions:
  contents: read
  packages: read
jobs:
  matrix:
    name: Validate compiler image targets
    if: >-
      github.repository == 'Mesh-LLM/skippy' &&
      (inputs.image-set != 'cpu' ||
       (github.event_name == 'pull_request' && vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true'))
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      gpu: ${{ steps.plan.outputs.gpu }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          matrix="$(jq -ce '
            .include as $rows
            | select(($rows | map([.backend, .arch]) | sort) == [
                ["cuda12", "amd64"], ["cuda12", "arm64"], ["cuda13", "amd64"],
                ["cuda13", "arm64"], ["rocm", "amd64"]])
            | select(all($rows[]; (.toolkit_version | test("^[0-9]+[.][0-9]+[.][0-9]+$")) and
              (.toolkit_base | test("@sha256:[a-f0-9]{64}$"))))
          ' ci/image-targets.json)"
          printf 'gpu=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  cpu-build:
    name: Build and test CPU image
    if: >-
      github.repository == 'Mesh-LLM/skippy' && inputs.build-images &&
      (inputs.image-set != 'gpu' ||
       (github.event_name == 'pull_request' && vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true'))
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      SKIPPY_CI_IMAGE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_REVISION: ${{ github.sha }}
      SKIPPY_CI_CACHE_REF: ghcr.io/mesh-llm/skippy-ci-cpu:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: just --justfile ci/images.just --working-directory . ci-image-build
      - run: time just --justfile ci/images.just --working-directory . ci-image-smoke
  gpu-build:
    name: Build and test ${{ matrix.backend }} image (${{ matrix.arch }})
    needs: matrix
    if: inputs.build-images
    runs-on: >-
      ${{ matrix.arch == 'arm64' && (vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-arm-4' || 'ubuntu-24.04-arm') ||
          (vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.gpu) }}
    env:
      SKIPPY_CI_IMAGE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}-${{ matrix.arch }}
      SOURCE_REVISION: ${{ github.sha }}
      SKIPPY_CI_CACHE_REF: ghcr.io/mesh-llm/skippy-ci-${{ matrix.backend }}:${{ matrix.arch == 'arm64' && 'latest-arm64' || 'latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Free unused runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
          TOOLKIT_BASE: ${{ matrix.toolkit_base }}
          TOOLKIT_VERSION: ${{ matrix.toolkit_version }}
        run: just --justfile ci/images.just --working-directory . ci-gpu-image-build "$BACKEND" "$TOOLKIT_BASE" "$TOOLKIT_VERSION" "$ARCH"
      - name: Smoke test image
        run: time just --justfile ci/images.just --working-directory . ci-gpu-image-smoke '${{ matrix.backend }}' '${{ matrix.arch }}'
