name: CI PR
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'skippy-api-rs/**'
      - 'skippy_api/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/path-filters.yml'
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - '.python-version'
      - 'ci/**'
      - '.gi/templates.yaml'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!docs-site/**'
jobs:
  validation:
    if: >-
      github.repository == 'Mesh-LLM/skippy' && vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' &&
      (github.event.pull_request.head.repo.id != github.event.repository.id || github.base_ref != 'main')
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    cache-mode: read
    uses: Mesh-LLM/skippy/.github/workflows/ci.yml@main
